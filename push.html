<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手機通知</title>
<link rel="manifest" href="./push.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="通知">
<style>
    :root {
        --paper: #fdf7ec;
        --frame: #2a1a10;
        --ink: #3d2010;
        --sub: #896645;
        --line: rgba(234, 176, 92, 0.45);
        --accent: #D95122;
        --honey: #EAB05C;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 20px 16px 40px;
        background: var(--frame);
        color: var(--ink);
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15px;
        line-height: 1.6;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 {
        color: #FFF5E1;
        font-size: 18px;
        letter-spacing: 2px;
        margin: 0 0 4px;
    }
    .lead { color: rgba(255, 245, 225, 0.6); font-size: 12px; margin: 0 0 18px; }
    .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
    }
    .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--ink); }
    label { display: block; font-size: 12px; color: var(--sub); margin: 10px 0 4px; }
    input {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 14px;
        font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--honey), var(--accent));
        color: #fff8ee;
        font-size: 15px;
        font-weight: bold;
        font-family: inherit;
        cursor: pointer;
    }
    button.ghost {
        background: none;
        border: 1px solid var(--line);
        color: var(--sub);
        font-weight: normal;
    }
    button:disabled { opacity: 0.5; }
    .state {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        background: rgba(234, 176, 92, 0.18);
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
    }
    .state.bad { background: #fff0ea; color: var(--accent); }
    .state.good { background: #eef7ec; color: #2f6b3a; }
    .note { font-size: 12px; color: var(--sub); margin-top: 10px; }
    .note b { color: var(--ink); }
    .warn {
        background: #fff7f3;
        border-color: rgba(217, 81, 34, 0.4);
    }
</style>
</head>
<body>
<div class="wrap">
    <h1>手機通知</h1>
    <p class="lead">丹醒來寫紙條的時候叮妳一下。點通知會直接開回這裡。</p>

    <div id="gate" class="card warn" hidden>
        <h2>要先加到主畫面</h2>
        <div class="note">
            iOS 只讓「加到主畫面」啟動的網頁收通知，Safari 分頁不行。<br><br>
            用 Safari 開<b>這一頁</b>（網址結尾是 <b>push.html</b>）→ 分享鈕 → <b>加入主畫面</b>，
            名字會是「<b>通知</b>」→ 從桌面那顆新圖示開啟，再按下面那顆。<br><br>
            開好之後這顆圖示就可以刪掉，訂閱不會跟著消失。
        </div>
    </div>

    <div class="card">
        <h2>連到橋</h2>
        <label for="url">橋的網址</label>
        <input id="url" type="url" placeholder="https://bridge.example.com" autocomplete="off">
        <label for="key">密鑰</label>
        <input id="key" type="password" placeholder="跟房間設定裡那把一樣" autocomplete="off">
        <button id="go">開啟通知</button>
        <button id="test" class="ghost">發一則測試</button>
        <button id="off" class="ghost">關掉通知</button>
        <div id="state" class="state">還沒開始。</div>
    </div>

    <div class="card">
        <div class="note">
            通知橫幅能顯示多少字是系統決定的，這裡不強求。<br>
            重點是點下去會落回妳自己的前端，全文在板子上看。
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    var LS = 'aurelia_push_cfg';
    var $ = function (id) { return document.getElementById(id); };
    var stateEl = $('state');

    function say(msg, kind) {
        stateEl.textContent = msg;
        stateEl.className = 'state' + (kind ? ' ' + kind : '');
    }

    function loadCfg() {
        try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (_) { return {}; }
    }
    function saveCfg(c) {
        try { localStorage.setItem(LS, JSON.stringify(c)); } catch (_) {}
    }

    /** 她可能貼的是聊天那條完整網址，把尾巴剝掉只留主機 */
    function normalizeBase(raw) {
        var u = String(raw || '').trim().replace(/\s+/g, '');
        if (!u) return '';
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        u = u.replace(/\/+$/, '');
        u = u.replace(/\/v1\/(chat\/completions|board|models|messages).*$/i, '');
        u = u.replace(/\/v1$/i, '');
        return u;
    }

    function b64ToUint8(base64) {
        var pad = '='.repeat((4 - base64.length % 4) % 4);
        var s = (base64 + pad).replace(/-/g, '+').replace(/_/g, '/');
        var raw = atob(s);
        var out = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
        return out;
    }

    function api(base, key, path, body) {
        return fetch(base + path, {
            method: body ? 'POST' : 'GET',
            headers: Object.assign(
                { 'Authorization': 'Bearer ' + key },
                body ? { 'Content-Type': 'application/json' } : {}
            ),
            body: body ? JSON.stringify(body) : undefined,
        }).then(function (r) {
            return r.text().then(function (t) {
                var data = null;
                try { data = JSON.parse(t); } catch (_) {}
                if (!r.ok) {
                    var msg = (data && data.error && data.error.message) || ('HTTP ' + r.status);
                    throw new Error(msg);
                }
                return data || {};
            });
        });
    }

    // 是不是從主畫面啟動的
    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!standalone) $('gate').hidden = false;

    var cfg = loadCfg();
    if (cfg.url) $('url').value = cfg.url;
    if (cfg.key) $('key').value = cfg.key;

    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        say('這個瀏覽器不支援推播。iOS 要 16.4 以上，而且要從主畫面開。', 'bad');
        $('go').disabled = true;
        $('test').disabled = true;
    }

    function ready() {
        return navigator.serviceWorker.register('./sw.js').then(function () {
            return navigator.serviceWorker.ready;
        });
    }

    $('go').addEventListener('click', function () {
        var base = normalizeBase($('url').value);
        var key = $('key').value.trim();
        if (!base || !key) { say('網址跟密鑰都要填。', 'bad'); return; }
        saveCfg({ url: base, key: key });
        $('go').disabled = true;
        say('正在問系統要通知權限…');

        // requestPermission 一定要在這顆按鈕的手勢裡呼叫，不能等 await 之後才叫
        Notification.requestPermission().then(function (perm) {
            if (perm !== 'granted') throw new Error('妳沒有允許通知（' + perm + '）。');
            say('取公鑰…');
            return api(base, key, '/v1/push/key');
        }).then(function (res) {
            if (!res.publicKey) throw new Error('橋那邊還沒有金鑰。');
            say('向系統註冊…');
            return ready().then(function (reg) {
                return reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: b64ToUint8(res.publicKey),
                });
            });
        }).then(function (sub) {
            say('把訂閱交給橋…');
            return api(base, key, '/v1/push/subscribe', { subscription: sub.toJSON() });
        }).then(function (res) {
            say('開好了。目前有 ' + (res.subscribers || 1) + ' 台裝置在收。\n按下面那顆發一則測試看看。', 'good');
        }).catch(function (e) {
            say('沒開成：' + (e && e.message ? e.message : e), 'bad');
        }).then(function () {
            $('go').disabled = false;
        });
    });

    $('test').addEventListener('click', function () {
        var c = loadCfg();
        if (!c.url || !c.key) { say('先按上面那顆開啟通知。', 'bad'); return; }
        $('test').disabled = true;
        say('發送中…');
        api(c.url, c.key, '/v1/push/test', {}).then(function (res) {
            var n = res.sent || 0;
            if (n > 0) say('推出去了（成功 ' + n + '、失敗 ' + (res.failed || 0) + '）。\n等一下就會跳出來。', 'good');
            else say('一台都沒推成。失敗 ' + (res.failed || 0) + '、失效 ' + (res.dropped || 0) + '。', 'bad');
        }).catch(function (e) {
            say('發不出去：' + (e && e.message ? e.message : e), 'bad');
        }).then(function () {
            $('test').disabled = false;
        });
    });

    $('off').addEventListener('click', function () {
        var c = loadCfg();
        say('取消中…');
        ready().then(function (reg) {
            return reg.pushManager.getSubscription();
        }).then(function (sub) {
            if (!sub) { say('本來就沒開。'); return null; }
            var ep = sub.endpoint;
            return sub.unsubscribe().then(function () {
                if (c.url && c.key) return api(c.url, c.key, '/v1/push/unsubscribe', { endpoint: ep });
            }).then(function () {
                say('關掉了，這台不會再收到。', 'good');
            });
        }).catch(function (e) {
            say('關不掉：' + (e && e.message ? e.message : e), 'bad');
        });
    });
})();
</script>
</body>
</html>
