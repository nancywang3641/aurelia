<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>留言板</title>
<link rel="manifest" href="./push.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
    :root {
        --paper: #fdf7ec;
        --frame: #2a1a10;
        --ink: #3d2010;
        --sub: #896645;
        --line: rgba(234, 176, 92, 0.45);
        --accent: #D95122;
        --honey: #EAB05C;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15px;
        line-height: 1.75;
    }
    .top {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
        background: var(--frame);
        color: #FFF5E1;
    }
    .top h1 { font-size: 16px; margin: 0; letter-spacing: 2px; font-weight: bold; }
    .top button {
        border: none;
        background: rgba(255, 245, 225, 0.12);
        color: #FFF5E1;
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
    }
    .wrap { padding: 14px 14px calc(30px + env(safe-area-inset-bottom, 0px)); max-width: 620px; margin: 0 auto; }

    /* 心跳條 */
    .hb {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 14px;
        margin-bottom: 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        border-left: 4px solid var(--honey);
        background: #fffdf6;
    }
    .hb-dot {
        flex-shrink: 0;
        width: 34px; height: 34px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(234, 176, 92, 0.22);
        color: var(--accent);
        font-size: 16px;
        animation: beat 2.6s ease-in-out infinite;
    }
    @keyframes beat {
        0%, 72%, 100% { transform: scale(1); }
        78% { transform: scale(1.14); }
        84% { transform: scale(1); }
        90% { transform: scale(1.09); }
    }
    .hb-main { flex: 1; min-width: 0; }
    .hb-cap { font-size: 11px; color: var(--sub); letter-spacing: 1px; }
    .hb-big { font-size: 16px; font-weight: bold; line-height: 1.35; }
    .hb-note { font-size: 11px; color: var(--sub); }
    .hb.late { border-left-color: var(--accent); background: #fff7f3; }
    .hb.late .hb-big { color: var(--accent); }
    .hb.stopped, .hb.off { border-left-color: #9a8c7d; background: #f6f2ec; }
    .hb.stopped .hb-dot, .hb.off .hb-dot { animation: none; background: rgba(154,140,125,0.22); color: #7d7166; }
    .hb.stopped .hb-big, .hb.off .hb-big { color: #5c534b; }

    /* 紙條 */
    .note {
        background: #fffdf6;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 13px 15px;
        margin-bottom: 12px;
    }
    .note.beat { border-left: 3px solid var(--honey); }
    .note-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
    }
    .note-who { font-size: 13px; font-weight: bold; }
    .note-time { font-size: 11px; color: var(--sub); }
    .note-tag {
        display: inline-block;
        margin-bottom: 7px;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 10px;
        background: rgba(234, 176, 92, 0.26);
        color: var(--sub);
    }
    .note-body { font-size: 14px; word-break: break-word; }
    .note-body p { margin: 0 0 10px; }
    .note-body p:last-child { margin-bottom: 0; }
    .note-body strong { color: var(--accent); }
    .note-src { margin-top: 8px; font-size: 11px; color: var(--sub); font-style: italic; }

    .msg { padding: 30px 16px; text-align: center; color: var(--sub); font-size: 13px; line-height: 1.9; }
    .msg a { color: var(--accent); }
</style>
</head>
<body>
<div class="top">
    <h1>留言板</h1>
    <button id="refresh" type="button">重新整理</button>
</div>
<div class="wrap" id="wrap">
    <div class="msg">正在拉紙條…</div>
</div>

<script>
(function () {
    'use strict';

    var LS = 'aurelia_push_cfg';
    var wrap = document.getElementById('wrap');

    function cfg() {
        try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (_) { return {}; }
    }
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    // 只做最基本的：粗體、換行。紙條就是純文字，不需要整套 markdown
    function body(text) {
        var t = esc(text).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        return t.split(/\n{2,}/).map(function (p) {
            return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
        }).join('');
    }
    function ts(iso) {
        var d = new Date(String(iso).replace(' ', 'T') + 'Z');
        if (isNaN(d.getTime())) return iso || '';
        var p = function (n) { return String(n).padStart(2, '0'); };
        return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function isBeat(n) {
        return !!(n && Array.isArray(n.tags) && n.tags.some(function (t) {
            return String(t).toLowerCase() === 'heartbeat';
        }));
    }
    function ago(hours) {
        if (hours < 1) return Math.max(1, Math.round(hours * 60)) + ' 分鐘前';
        if (hours < 24) return Math.round(hours) + ' 小時前';
        var d = hours / 24;
        return d < 2 ? '一天多前' : Math.floor(d) + ' 天前';
    }
    // 橋那邊的規則：六小時內不吵，之後機率往上爬，滿一天強制
    function outlook(h) {
        if (h < 6)  return { k: '', t: '安靜期，再過 ' + Math.max(1, Math.round(6 - h)) + ' 小時才開始有機會' };
        if (h < 12) return { k: '', t: '開始有機會了，不過通常還要再等等' };
        if (h < 20) return { k: '', t: '機會越來越高' };
        if (h < 25) return { k: '', t: '隨時會醒' };
        if (h < 48) return { k: 'late', t: '該醒了卻沒動靜' };
        return { k: 'stopped', t: '心跳停了' };
    }

    function heartbeat(posts) {
        var beats = posts.filter(isBeat);
        if (!beats.length) {
            return '<section class="hb"><span class="hb-dot">♥</span><div class="hb-main">'
                 + '<div class="hb-cap">丹的心跳</div><div class="hb-big">連得上，還沒自己醒過</div>'
                 + '<div class="hb-note">他一天大概會自己醒一次。</div></div></section>';
        }
        var t = new Date(String(beats[0].created_at).replace(' ', 'T') + 'Z').getTime();
        var h = isNaN(t) ? 0 : (Date.now() - t) / 3600000;
        var o = outlook(h);
        return '<section class="hb ' + o.k + '"><span class="hb-dot">♥</span><div class="hb-main">'
             + '<div class="hb-cap">丹的心跳</div>'
             + '<div class="hb-big">' + esc(ago(h)) + '醒過</div>'
             + '<div class="hb-note">' + esc(o.t) + ' · 一共 ' + beats.length + ' 則</div>'
             + '</div></section>';
    }

    function render(posts) {
        var html = heartbeat(posts);
        if (!posts.length) {
            html += '<div class="msg">板子還是空的。</div>';
        } else {
            html += posts.map(function (n) {
                var src = (n.sources && n.sources.length)
                    ? '<div class="note-src">' + esc([].concat(n.sources).join(' · ')) + '</div>' : '';
                return '<article class="note' + (isBeat(n) ? ' beat' : '') + '">'
                     + '<div class="note-head"><span class="note-who">' + esc(n.author || '?') + '</span>'
                     + '<time class="note-time">' + esc(ts(n.created_at)) + '</time></div>'
                     + (isBeat(n) ? '<span class="note-tag">自己醒來寫的</span>' : '')
                     + '<div class="note-body">' + body(n.content) + '</div>'
                     + src + '</article>';
            }).join('');
        }
        wrap.innerHTML = html;
    }

    function load() {
        var c = cfg();
        if (!c.url || !c.key) {
            wrap.innerHTML = '<div class="msg">還沒設定連線。<br>'
                           + '去 <b>設定 → 系統/備份 → 手機通知</b> 填一次網址跟密鑰，這裡就會自己讀到。</div>';
            return;
        }
        wrap.innerHTML = '<div class="msg">正在拉紙條…</div>';
        fetch(c.url + '/v1/board?limit=100', {
            headers: { 'Authorization': 'Bearer ' + c.key },
        }).then(function (r) {
            return r.text().then(function (t) {
                if (!r.ok) throw new Error('HTTP ' + r.status + '：' + t.slice(0, 120));
                return JSON.parse(t);
            });
        }).then(function (d) {
            render(Array.isArray(d.posts) ? d.posts : []);
        }).catch(function (e) {
            wrap.innerHTML = '<div class="msg">讀不到板子。<br>' + esc(e && e.message ? e.message : e) + '</div>';
        });
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
})();
</script>
</body>
</html>
