    <!-- ⚠️ 不要改回 black-translucent。實測(iPhone 932pt)：translucent 下頁面畫布佔滿整個
         932，內容確實壓在狀態列底下，但版面視口只有 873(innerHeight/clientHeight/visualViewport
         三個都是 873)，而且是從螢幕頂端 0 開始算 —— 於是螢幕最底下 59pt 落在所有
         position:fixed inset:0 的盒子外面，只有 html/body 的畫布底色塗得到，就是底部那條。
         那 59 跟 home indicator 的安全區(34)不是同一件事，用 env(safe-area-inset-bottom)
         永遠補不到。改成不透明 black：視口與畫布對齊，fixed 盒子才真的到底。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

         env(safe-area-inset-*) 也一起塌成 0。拿掉 manifest 才會回到 black-translucent 的滿版路徑。
         pwa.json 檔案保留（推播那條線之後要用），只是不掛上來。
    <link rel="manifest" href="pwa.json" /> -->

    <!-- 🤖 AI 助手（Claude / Codex 房間）—— 獨立擴展 claude-codex-room，自己一個 git repo。
         它的核心零酒館依賴（只吃 OS_SETTINGS / OS_DB / fetch），所以獨立版直接載得起來；
         大廳 dock 那顆「宿舍」找的就是 window.ChatWindow，沒載到按了會顯示斷在哪一段。
         🚨 走 CDN 鎖 commit，不要改回 "../claude-codex-room/index.js"。這份 index.html 有兩個家：
            VPS 的酒館（隔壁真的有那個資料夾）跟 GitHub Pages（她手機上的 PWA 是這個）。
            Pages 上「隔壁」是另一個 repo 的 Pages 站，沒開＝404，相對路徑只有一半的場合成立。
            CDN 這條在兩邊都一樣，是唯一同時成立的寫法。
         🚨 房間改版要同時把下面兩處的 commit 換掉（__CCR_BASE__ 與 script src 必須同一個），
            換完先用瀏覽器打一次新網址預熱，不然手機第一次會等 jsDelivr 回源。
         ⚠️ 它自己會載自己的 core/css（帶 ?v=VER、順序自己管），這裡只拉 index.js 一支，
            也不要把它的檔案抄進本 repo 的載入清單 —— 那邊改版跟這邊是兩條 git 線。
         ⚠️ 位置必須在 os_settings.js / os_db.js 之後：房間會先看這兩個在不在，
            在就沿用（設定與對話存檔跟奧瑞亞共用同一份），不在才自己裝一份 shim。 -->
    <script>
        /* 浮球不用在這裡關 —— void_terminal.js 一載入就會設 __CCR_NO_LAUNCHER__，
           因為入口已經收攏成大廳 dock 的「宿舍」那一顆。 */
        window.__CCR_BASE__ = "https://testingcf.jsdelivr.net/gh/nancywang3641/claude-codex-room@8eb4ead/";
    </script>
    <script src="https://testingcf.jsdelivr.net/gh/nancywang3641/claude-codex-room@8eb4ead/index.js"></script>


    <script>
    (function () {
        'use strict';

        // ── ST 事件系統 stub ──
        window.eventOn    = window.eventOn    || function () {};
        window.eventOnce  = window.eventOnce  || function () {};
        window.eventOff   = window.eventOff   || function () {};
        window.eventEmit  = window.eventEmit  || function () {};
        window.eventOnButton  = window.eventOnButton  || function () {};
        window.TavernHelper   = null;

        (function () {
            try {
                const wxCfg  = JSON.parse(localStorage.getItem('wx_phone_api_config') || '{}');
                const mainCfg = JSON.parse(localStorage.getItem('os_global_config')    || '{}');
                wxCfg.directMode    = true;
                wxCfg.disableTyping = true;
                if (!wxCfg.url   && mainCfg.url)   wxCfg.url   = mainCfg.url;
                if (!wxCfg.key   && mainCfg.key)   wxCfg.key   = mainCfg.key;
                if (!wxCfg.model && mainCfg.model) wxCfg.model = mainCfg.model;
                if (!wxCfg.maxTokens && mainCfg.maxTokens) wxCfg.maxTokens = mainCfg.maxTokens;
                localStorage.setItem('wx_phone_api_config', JSON.stringify(wxCfg));
            } catch(e) {}
        })();
        window.tavern_events  = window.tavern_events  || {
            MESSAGE_RECEIVED: 'message_received',
            MESSAGE_SENT:     'message_sent',
            CHAT_CHANGED:     'chat_changed',
            CHARACTER_MESSAGE_RENDERED: 'character_message_rendered',
        };
        window.PANEL_COMMUNICATION = { ready: true, processors: {}, modulesLoaded: {} };

        // ── 載入進度條 ──
        const bootBar   = document.getElementById('aurelia-boot-bar');
        const bootLabel = document.getElementById('aurelia-boot-label');
        let _progress = 0;
        function setProgress(pct, label) {
            _progress = pct;
            if (bootBar)   bootBar.style.width = pct + '%';
            if (bootLabel && label) bootLabel.textContent = label;
        }

        function hideBoot() {
            const boot = document.getElementById('aurelia-boot');
            if (boot) {
                boot.classList.add('hidden');
                setTimeout(() => boot.remove(), 700);
            }
        }

        // ── 全域快捷函式 ──
        window.togglePhoneSystem = function() {
            if (window.PhoneSystem) window.PhoneSystem.show();
            else console.warn('[Aurelia] 手機系統尚未就緒');
        };

        // ── 手機 App 註冊 ──
        function registerApps() {
            const PS = window.PhoneSystem;
            if (!PS) return;
            if (window.RPG_PANEL)    PS.install('RPG 狀態',  '🛡️', '#5d4037', window.RPG_PANEL.launch);
            if (window.OS_TAROT)     PS.install('賽博塔羅',  '🔮', '#9b59b6', window.OS_TAROT.launch);
            if (window.VN_STORY)     PS.install('故事模式',  '📖', '#ff69b4', window.VN_STORY.launch);
            if (window.OS_WORLDBOOK) PS.install('世界書',    '📗', '#1a3a5c', c => window.OS_WORLDBOOK.launch(c));
            if (window.OS_AVS)       PS.install('變數工坊',  '🎲', '#e67e22', c => window.OS_AVS.launch(c));
            if (window.OS_SETTINGS)  PS.install('設置',      '⚙️', '#4c4c4c', window.OS_SETTINGS.launchApp);
        }

        // ── 主初始化流程 ──
        function init() {
            setProgress(20, 'MOUNTING LOBBY');

            const root = document.getElementById('aurelia-standalone-root');
            if (window.AureliaControlCenter && root) {
                window.AureliaControlCenter.mountEmbedded(root, 'bottom');
            } else {
                console.error('[Aurelia] AureliaControlCenter 未載入，請檢查 core/ 路徑');
            }

            setProgress(60, 'REGISTERING APPS');

            setTimeout(() => {
                registerApps();
                setProgress(90, 'STARTING');
            }, 800);

            setTimeout(() => {
                window.eventEmit('APP_READY');
                window.eventEmit('VN_PANEL_READY');
                window.eventEmit('CHAT_CHANGED');
                setProgress(100, 'READY');
                setTimeout(hideBoot, 300);
            }, 1500);
        }

        // ── Service Worker 註冊（iOS PWA 背景恢復快取）──
        if ('serviceWorker' in navigator) {
            // 當新 SW 取得控制權時，強制重新整理頁面以確保加載最新的 JS/CSS
            // （舊 SW 可能已用 Cache-First 提供了舊檔案，換 SW 後必須 reload）
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                console.log('[SW] 偵測到新版本接管，自動重新整理…');
                window.location.reload();
            });

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(reg => {
                        console.log('[SW] 已註冊', reg.scope);
                        // 強制立刻檢查 sw.js 是否有新版本（不等 24 小時）
                        // 這讓 iOS 在每次開啟 App 時都能偵測到新部署
                        reg.update().catch(() => {});
                    })
                    .catch(e => console.warn('[SW] 註冊失敗', e));
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>
</body>
</html>
